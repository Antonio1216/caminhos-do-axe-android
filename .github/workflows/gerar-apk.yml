name: Gerar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataformas do Android SDK
        run: |
          sdkmanager --version
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Caminhos-do-Axe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
